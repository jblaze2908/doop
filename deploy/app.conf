# Draft on scale0's deployer (github.com/jblaze2908/scale0, lib/deployer.py), which replaces pull-update.sh on Ihara.
# The app sleeps under scale0 when idle; the health check goes through the address scale0 holds, which wakes it.
[app]
compose = deploy/compose.yml
project = draft
env_file = /etc/draft/draft.env
branch = main
key =
health = http://172.17.0.1:8320/healthz
backup = pg_dump:db
notify = NTFY_URL NTFY_TOKEN

[service.db]
mode = always

[service.app]
mode = sleep
scale0 = draft
