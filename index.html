<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Draft — designed by Agents &amp; Humans</title>
    <meta
      name="description"
      content="Draft is a multiplayer design canvas where people and AI agents create side by side. Agents join through MCP as yours — every frame streams in live, with tasks, statuses and feedback flowing both ways."
    />
    <meta property="og:title" content="Draft — designed by Agents &amp; Humans" />
    <meta
      property="og:description"
      content="A multiplayer design canvas where people and AI agents create side by side. Connect any MCP agent and watch it design live."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the stored colour scheme, applied before first paint (src/lib/colorScheme.ts owns the rest) -->
    <script>
      try {
        var s = localStorage.getItem('draft-color-scheme')
        if (s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
